version: 1
spec_id: INT-2026-0904
execution_policy:
  max_task_attempts: 4
  max_same_failure_repeats: 2
tasks:
  - id: T001
    title: Compact 도구체인과 private 관계 계약 구축
    outcome: 고정된 공식 버전의 로컬 Compact 도구체인으로 관계 생성·철회 계약을 컴파일하고, public ledger에는 원문 대신 commitment와 version만 남긴다.
    requirements: [R2.1, R2.2, R2.3, R3.1, R5.4, R8.2, R8.3, R8.5]
    depends_on: []
    context:
      files:
        - package.json
        - pnpm-workspace.yaml
        - .gitignore
        - packages/engine/src/characters.ts
        - packages/midnight-contract/
      symbols:
        - CHARACTERS
        - openRelationship
        - revokeRelationship
        - ownerCommitment
        - mandateCommitment
        - relationshipCommitment
    scope:
      allowed_paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .gitignore
        - scripts/midnight/**
        - packages/midnight-contract/**
        - .claude/specs/midnight-private-mandate/state.yaml
        - .claude/specs/midnight-private-mandate/evidence/T001.json
      forbidden_paths:
        - .claude/specs/midnight-private-mandate/requirements.md
        - .claude/specs/midnight-private-mandate/design.md
        - .claude/specs/midnight-private-mandate/approvals.yaml
        - .claude/specs/midnight-private-mandate/tasks.yaml
        - .claude/specs/adr/**
        - .github/workflows/base-contract.yml
        - packages/contracts/**
        - packages/shared/**
        - apps/**
        - .env
        - "**/*.key"
        - "**/*.pem"
      must_preserve:
        - Compact devtools 0.5.1, compiler 0.31.1, runtime 0.16.0, Compact JS 2.5.1, Ledger 8.1.0, Midnight.js/testkit 4.1.1 조합을 exact pin한다.
        - 캐릭터 ID·mandate 원문·secret·nonce·정확한 관계 상태를 public ledger나 오류에 기록하지 않는다.
        - 생성된 contract JS·ZKIR·prover/verifier key·metadata만 managed artifact로 추적하고 compiler binary와 private/deployment state는 추적하지 않는다.
        - 기존 EVM 계약과 베이스 검증 경로를 변경하지 않는다.
    capabilities:
      network: true
      secrets: false
      database_write: none
      production_write: false
      delete: false
      git_commit: false
      git_push: false
      deploy: false
    verification:
      fast:
        - pnpm midnight:versions
        - pnpm midnight:compile
        - pnpm midnight:test
      full:
        - pnpm test
        - pnpm typecheck
    evidence: evidence/T001.json

  - id: T002
    title: 캐릭터 판단 proof와 관계 신뢰 전이 구현
    outcome: 기존 결정론 엔진의 두 캐릭터 판단을 Compact가 다시 검증하고 replay·위반을 거부하며, owner 결정과 검증된 관계 이벤트만 commitment 전이로 반영한다.
    requirements: [R3.2, R3.3, R3.4, R4.1, R4.2, R4.3, R4.4, R5.1, R5.2, R5.3, R5.4, R6.1, R6.2, R6.3, R6.4, R6.5, R6.6, R6.8, R8.3]
    depends_on: [T001]
    context:
      files:
        - packages/engine/src/characters.ts
        - packages/engine/src/decide.ts
        - packages/engine/src/trust.ts
        - packages/midnight-contract/
      symbols:
        - characterOf
        - decide
        - computeTrust
        - TRUST_FORMULA_VERSION
        - CHARACTER_CATALOG_VERSION
        - proveDecision
        - resolvePending
        - recordRelationshipEvent
    scope:
      allowed_paths:
        - packages/engine/src/characters.ts
        - packages/engine/src/index.ts
        - packages/engine/src/decide.test.ts
        - packages/engine/src/trust.test.ts
        - packages/midnight-contract/**
        - .claude/specs/midnight-private-mandate/state.yaml
        - .claude/specs/midnight-private-mandate/evidence/T002.json
      forbidden_paths:
        - .claude/specs/midnight-private-mandate/requirements.md
        - .claude/specs/midnight-private-mandate/design.md
        - .claude/specs/midnight-private-mandate/approvals.yaml
        - .claude/specs/midnight-private-mandate/tasks.yaml
        - .claude/specs/adr/**
        - .github/workflows/base-contract.yml
        - packages/contracts/**
        - packages/shared/**
        - apps/**
        - .env
        - "**/*.key"
        - "**/*.pem"
      must_preserve:
        - packages/engine은 런타임 의존성 없이 결정론적으로 동작하고 public API는 CHARACTER_CATALOG_VERSION 추가 외에는 바꾸지 않는다.
        - 신뢰는 자동 실행 자격에만 사용하고 거래 방향·목표 비중·금액 계산에는 사용하지 않는다.
        - TypeScript witness가 계산한 membership·commitment·division·bounds·trust delta를 circuit assert로 재검증한다.
        - receipt는 decision ID와 commitment·catalog·trust formula·circuit version에 결합하고 private 원문을 포함하지 않는다.
        - EVM execution inclusion을 증명하거나 AgentVault 강제를 대체하지 않는다.
    capabilities:
      network: false
      secrets: false
      database_write: none
      production_write: false
      delete: false
      git_commit: false
      git_push: false
      deploy: false
    verification:
      fast:
        - pnpm midnight:compile
        - pnpm midnight:test
        - pnpm exec vitest run packages/engine/src/decide.test.ts packages/engine/src/trust.test.ts
      full:
        - pnpm test
        - pnpm typecheck
    evidence: evidence/T002.json

  - id: T003
    title: Lace 연결과 브라우저 private proof client 구축
    outcome: 웹이 Lace와 공식 provider를 통해 계약을 연결하고 bounded proof 입력을 제출하되, private state는 메모리에만 두고 loopback proof server가 아니면 fail-closed한다.
    requirements: [R2.4, R2.5, R2.6, R3.4, R3.5, R4.4, R5.5, R6.8, R8.2]
    depends_on: [T002]
    context:
      files:
        - apps/web/package.json
        - apps/web/src/main.tsx
        - apps/web/src/config.ts
        - apps/web/src/midnight/
        - packages/midnight-contract/managed/
      symbols:
        - CharacterRelationshipPrivateState
        - DemoPhase
        - createMidnightClient
        - createPrivateState
        - toProofInput
    scope:
      allowed_paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - apps/web/package.json
        - apps/web/tsconfig.json
        - apps/web/vite.config.ts
        - apps/web/src/vite-env.d.ts
        - apps/web/src/midnight/**
        - .claude/specs/midnight-private-mandate/state.yaml
        - .claude/specs/midnight-private-mandate/evidence/T003.json
      forbidden_paths:
        - .claude/specs/midnight-private-mandate/requirements.md
        - .claude/specs/midnight-private-mandate/design.md
        - .claude/specs/midnight-private-mandate/approvals.yaml
        - .claude/specs/midnight-private-mandate/tasks.yaml
        - .claude/specs/adr/**
        - .github/workflows/base-contract.yml
        - packages/contracts/**
        - packages/shared/**
        - packages/engine/**
        - apps/web/src/App.tsx
        - .env
        - "**/*.key"
        - "**/*.pem"
      must_preserve:
        - DApp Connector API 4.0.1과 Midnight.js 4.1.1을 exact pin하고 wallet network와 contract network가 다르면 중단한다.
        - proof server URL은 localhost:6300 또는 127.0.0.1:6300만 허용한다.
        - owner secret·nonce·mandate·정확한 trust 값은 localStorage·sessionStorage·URL·로그·오류에 넣지 않는다.
        - private state가 없거나 version·commitment가 다르면 기본값을 만들지 않고 proof를 중단한다.
        - circuit call은 동시에 하나만 허용하고 used 또는 pending decision을 재조회한 뒤 retry한다.
    capabilities:
      network: true
      secrets: false
      database_write: none
      production_write: false
      delete: false
      git_commit: false
      git_push: false
      deploy: false
    verification:
      fast:
        - pnpm exec vitest run apps/web/src/midnight
        - pnpm typecheck
        - pnpm --filter @soon/web build
      full:
        - pnpm test
        - pnpm midnight:test
    evidence: evidence/T003.json

