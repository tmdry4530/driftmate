  - id: T005
    title: Local Devnet 실제 proof E2E 완성
    outcome: 공식 고정 버전의 Local Devnet·indexer·로컬 proof server에서 valid flow가 실제 proof와 finalized transaction을 만들고 위반·replay·누출 검사가 실패 또는 비공개를 입증한다.
    requirements: [R2.2, R2.4, R3.3, R4.2, R5.1, R5.2, R5.3, R5.4, R5.5, R6.3, R6.4, R6.5, R6.6, R6.8, R6.9, R7.3, R8.2, R8.3, R8.5]
    depends_on: [T002, T003]
    context:
      files:
        - infra/midnight/
        - packages/midnight-contract/e2e/
        - packages/midnight-contract/managed/
        - scripts/midnight/
      symbols:
        - openRelationship
        - proveDecision
        - resolvePending
        - recordRelationshipEvent
        - revokeRelationship
    scope:
      allowed_paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .gitignore
        - scripts/midnight/**
        - infra/midnight/**
        - packages/midnight-contract/e2e/**
        - packages/midnight-contract/package.json
        - packages/midnight-contract/src/**/*.test.ts
        - .claude/specs/midnight-private-mandate/state.yaml
        - .claude/specs/midnight-private-mandate/evidence/T005.json
      forbidden_paths:
        - .claude/specs/midnight-private-mandate/requirements.md
        - .claude/specs/midnight-private-mandate/design.md
        - .claude/specs/midnight-private-mandate/approvals.yaml
        - .claude/specs/midnight-private-mandate/tasks.yaml
        - .claude/specs/adr/**
        - .github/workflows/base-contract.yml
        - packages/contracts/**
        - packages/shared/**
        - packages/engine/**
        - apps/**
        - .env
        - "**/*.key"
        - "**/*.pem"
      must_preserve:
        - deploy와 database write는 이 저장소가 시작한 Local Devnet 및 test fixture에만 수행한다.
        - proof server는 loopback에서 실행하고 private fixture를 process output·ledger snapshot·transaction output에 남기지 않는다.
        - 실제 proof generation과 transaction finalization을 fake provider 또는 mocked success로 대체하지 않는다.
        - EVM transaction과 Midnight receipt는 별도 증거로 유지한다.
        - 같은 환경 실패가 2회 반복되면 설정을 추측해 바꾸지 않고 TASK_BLOCKED로 보고한다.
    capabilities:
      network: true
      secrets: false
      database_write: test-only
      production_write: false
      delete: false
      git_commit: false
      git_push: false
      deploy: true
    verification:
      fast:
        - pnpm midnight:e2e
      full:
        - pnpm midnight:versions
        - pnpm midnight:compile
        - pnpm midnight:test
        - pnpm --filter @soon/web build
    evidence: evidence/T005.json

  - id: T006
    title: 제출 문서와 전체 회귀 검증 마감
    outcome: README만으로 새 clone의 준비·실행·실패 진단·90초 데모가 재현되고, 제출 카피가 실제 구현 경계와 일치하며 베이스 6종과 Midnight 4종 검증이 모두 통과한다.
    requirements: [R1.2, R1.3, R1.4, R1.5, R6.7, R6.8, R6.9, R8.1, R8.2, R8.3, R8.4, R8.5]
    depends_on: [T004, T005]
    context:
      files:
        - README.md
        - .env.example
        - package.json
        - .claude/specs/midnight-private-mandate/requirements.md
        - .claude/specs/midnight-private-mandate/design.md
      symbols:
        - midnight:versions
        - midnight:compile
        - midnight:test
        - midnight:e2e
    scope:
      allowed_paths:
        - README.md
        - .env.example
        - package.json
        - .claude/specs/midnight-private-mandate/state.yaml
        - .claude/specs/midnight-private-mandate/evidence/T006.json
      forbidden_paths:
        - .claude/specs/midnight-private-mandate/requirements.md
        - .claude/specs/midnight-private-mandate/design.md
        - .claude/specs/midnight-private-mandate/approvals.yaml
        - .claude/specs/midnight-private-mandate/tasks.yaml
        - .claude/specs/adr/**
        - .github/workflows/base-contract.yml
        - packages/**
        - apps/**
        - scripts/**
        - infra/**
        - pnpm-lock.yaml
        - .env
        - "**/*.key"
        - "**/*.pem"
      must_preserve:
        - 제품 문장은 “내 전략은 캐릭터만 알고, Midnight은 그 아이가 약속을 지켰는지만 증명한다.”로 통일한다.
        - README는 실제 구현된 Local Devnet 흐름만 설명하고 Midnight 자산 보관·swap·EVM 강제·수익 예측을 주장하지 않는다.
        - private/proven/public 표와 캐릭터 관리 루프, exact prerequisites, 명령, 90초 시나리오를 포함한다.
        - contracts:setup은 새 clone과 이미 forge-std가 설치된 worktree에서 모두 exit 0이어야 한다.
        - 전체 검증에서 동작 변경이 필요하면 이 태스크에서 고치지 않고 SPEC_CHANGE_REQUESTED를 보고한다.
    capabilities:
      network: true
      secrets: false
      database_write: test-only
      production_write: false
      delete: false
      git_commit: false
      git_push: false
      deploy: true
    verification:
      fast:
        - pnpm midnight:versions
        - pnpm --filter @soon/web build
        - pnpm midnight:e2e
      full:
        - pnpm test
        - pnpm typecheck
        - pnpm --filter @soon/web build
        - pnpm contracts:setup
        - pnpm contracts:test
        - pnpm e2e
        - pnpm midnight:versions
        - pnpm midnight:compile
        - pnpm midnight:test
        - pnpm midnight:e2e
    evidence: evidence/T006.json
